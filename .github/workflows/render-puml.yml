name: Render PlantUML diagrams to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**/*.puml'
      - '.github/workflows/render-puml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz plantuml

      - name: Render PlantUML diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          mapfile -t puml_files < <(find docs -type f -name '*.puml' | sort)

          if [ ${#puml_files[@]} -eq 0 ]; then
            echo "No PlantUML files found under docs/."
            cat > site/index.html <<'EOF'
            <!doctype html>
            <html lang="es">
              <head>
                <meta charset="utf-8" />
                <title>Diagramas PlantUML</title>
              </head>
              <body>
                <h1>No hay diagramas PlantUML aún</h1>
              </body>
            </html>
            EOF
            exit 0
          fi

          for puml in "${puml_files[@]}"; do
            echo "Rendering $puml"
            plantuml -tsvg -o site "$puml"
          done

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8" />
              <title>Diagramas PlantUML</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 2rem; }
                img { max-width: 100%; border: 1px solid #ddd; padding: 0.5rem; }
              </style>
            </head>
            <body>
              <h1>Diagramas PlantUML</h1>
              <p>Estos diagramas se generan automáticamente desde los archivos .puml en la carpeta docs.</p>
              <ul>
          EOF

          for puml in "${puml_files[@]}"; do
            name=$(basename "$puml" .puml)
            echo "              <li><a href=\"${name}.svg\">${name}</a></li>" >> site/index.html
          done

          cat >> site/index.html <<'EOF'
              </ul>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: puml-site
          path: site

      - name: Summary
        run: |
          echo "Site generated in ./site" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the artifact 'puml-site' to download the generated HTML and SVG files." >> "$GITHUB_STEP_SUMMARY"
