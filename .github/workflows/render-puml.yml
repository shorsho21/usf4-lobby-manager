name: Render PlantUML diagrams to GitHub Actions artifact

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**/*.puml'
      - '.github/workflows/render-puml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz plantuml

      - name: Render PlantUML diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          mapfile -t puml_files < <(find docs -type f -name '*.puml' | sort)

          if [ ${#puml_files[@]} -eq 0 ]; then
            echo "No PlantUML files found under docs/."
            python -c 'from pathlib import Path; Path("site/index.html").write_text("""<!doctype html>\n<html lang=\"es\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>Diagramas PlantUML</title>\n  </head>\n  <body>\n    <h1>No hay diagramas PlantUML aún</h1>\n  </body>\n</html>\n""", encoding="utf-8")'
            exit 0
          fi

          for puml in "${puml_files[@]}"; do
            echo "Rendering $puml"
            plantuml -tsvg -o site "$puml"
          done

          python -c 'from pathlib import Path; puml_files = sorted(Path("docs").rglob("*.puml")); items = ["              <li><a href=\"{}\">{}</a></li>".format(p.stem + ".svg", p.stem) for p in puml_files]; Path("site/index.html").write_text("""<!doctype html>\n<html lang=\"es\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>Diagramas PlantUML</title>\n    <style>\n      body { font-family: Arial, sans-serif; margin: 2rem; }\n      img { max-width: 100%; border: 1px solid #ddd; padding: 0.5rem; }\n    </style>\n  </head>\n  <body>\n    <h1>Diagramas PlantUML</h1>\n    <p>Estos diagramas se generan automáticamente desde los archivos .puml en la carpeta docs.</p>\n    <ul>\n""" + "\n".join(items) + "\n    </ul>\n  </body>\n</html>\n""", encoding="utf-8")'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: puml-site
          path: site

      - name: Summary
        run: |
          echo "Site generated in ./site" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the artifact 'puml-site' to download the generated HTML and SVG files." >> "$GITHUB_STEP_SUMMARY"
